
name: todo
description: "Flutter To-Do app with location and reminders"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local task storage
  shared_preferences: ^2.5.3

  # Notifications and timezone
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^4.1.1

  # Map and location picker
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true